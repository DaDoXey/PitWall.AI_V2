# I controlli di PitWall a ogni push: la stessa verifica che si lancia in locale
# (strumenti/verifica.py --veloce), senza chiave e senza rete verso il modello.
# I percorsi nel browser e le catture restano in locale: vogliono i due server accesi.
# Il test dei tracciati viene saltato e segnalato: legge le immagini, che non sono nel repository.
# Gira su Windows, come PitWall: la telemetria di ACC è memoria condivisa di Windows, e su
# Linux quei test non possono passare (strutture di dimensione diversa).
name: verifica

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dipendenze del backend
        run: pip install -r backend/requirements.txt

      - name: Dipendenze del frontend
        working-directory: frontend
        run: npm ci

      - name: Guardiano sull'ultimo commit
        shell: bash
        run: |
          git fetch --depth=2 origin "${{ github.sha }}" || true
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "strumenti")
          import guardiano
          file = subprocess.run(["git", "show", "--name-only", "--format=", "HEAD"], capture_output=True, text=True).stdout.split()
          vietati = [f for f in file if guardiano.combacia(f, guardiano.MAI) and f not in guardiano.CONSENTITI]
          if vietati:
              sys.exit("file che non devono stare nel repository: " + ", ".join(vietati))
          print("nessun file vietato nell'ultimo commit")
          PY

      - name: Verifica
        run: python strumenti/verifica.py --veloce
