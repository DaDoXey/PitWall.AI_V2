# Un controllo al giorno che il backend della vetrina risponda.
#
# A tenerlo sveglio NON è più questo file: dal 06/10 lo fa un servizio esterno (cron-job.org,
# una richiesta ogni 10 minuti di giorno), perché GitHub non garantisce l'orario dei giri
# programmati: li ritarda di ore e ne salta. Qui resta solo il controllo, che scrive l'esito
# in un'annotazione; si può anche lanciare a mano (Actions → sveglia → Run workflow).
#
# L'indirizzo sta nella variabile del repository PITWALL_BACKEND_URL
# (Settings → Secrets and variables → Actions → Variables). Senza, è un errore.
name: sveglia

on:
  schedule:
    # una volta al giorno, a un minuto lontano dall'ora piena
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sveglia:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Una richiesta al backend
        env:
          BACKEND: ${{ vars.PITWALL_BACKEND_URL }}
        run: |
          # L'esito diventa un'annotazione del controllo: si legge senza aprire i log.
          if [ -z "$BACKEND" ]; then
            echo "::error title=sveglia NON CONFIGURATA::manca la variabile del repository PITWALL_BACKEND_URL: il controllo non ha chiamato nessuno"
            exit 1
          fi
          esito=$(curl --silent --max-time 100 --output /dev/null --write-out "%{http_code} in %{time_total} s" "$BACKEND/" || true)
          case "$esito" in
            200*) echo "::notice title=sveglia::il backend ha risposto $esito (oltre 10 s vuol dire che dormiva: guardare il servizio esterno)" ;;
            *)    echo "::error title=sveglia: il backend NON ha risposto::esito $esito"; exit 1 ;;
          esac
